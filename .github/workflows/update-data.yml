name: Refresh market data and model

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh market data
        run: python scripts/update_market_data.py

      - name: Rebuild model
        run: python scripts/build_model.py

      - name: Test repository
        run: pytest -q

      - name: Commit refreshed model snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_history.csv data/market_update.json data/model.json data/model.js
          git diff --cached --quiet || git commit -m "data: refresh market inputs and model"
          git push
